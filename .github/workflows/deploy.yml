name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to validate and publish (leave empty for checks only)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  windows-cli:
    name: Windows CLI shims
    runs-on: windows-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Update npm CLI
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Verify Windows npm command shims
        run: npx vitest run test/windows-cli.test.ts

  publish:
    needs: windows-cli
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Update npm CLI
        run: npm install --global npm@12.0.1

      - name: Verify tag matches package version
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node -e "const p=require('./package.json'); const expected='v'+p.version; if(process.env.RELEASE_TAG!==expected){ console.error('tag '+process.env.RELEASE_TAG+' does not match '+expected); process.exit(1); }"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      - name: Smoke-test packed CLI
        run: npm run smoke:package

      - name: Publish package
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
