name: Deploy Attend website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'src/ui/console.ts'
      - 'src/core/themes.ts'
      - 'src/core/theme-colors.ts'
      - 'src/core/work-stats.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'docs/assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install renderer build dependencies
        run: npm ci --ignore-scripts
      - name: Build English static site
        run: node website/build.mjs
      - name: Check generated pages
        run: node website/check.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
